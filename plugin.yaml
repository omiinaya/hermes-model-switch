name: hermes-model-switch
version: 0.2.0
description: "Lets the agent switch its own model mid-session on the user's explicit ask, plus a model list action. Session-scoped; no global writes without an explicit 'globally'."
pip_dependencies: []
# Declared so `hermes plugins validate` can prove the manifest matches what register()
# actually installs. An undeclared registration is a validation failure, which is exactly
# what kept this plugin out of the curated catalog.
provides_tools:
  - modelctl
provides_hooks:
  - pre_gateway_dispatch
hooks:
  - pre_gateway_dispatch
